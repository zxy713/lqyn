<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乐庆余年 - 社交版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, rgba(255,243,230,0.8), rgba(255,229,204,0.8));
            min-height: 100vh;
            padding: 15px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('背景图.jpg') center/cover no-repeat;
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .ai-chat-btn {
            width: 50px;
            height: 50px;
            background-color: #ff9966;
            border: none;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .search-box {
            flex: 0.9;
            display: flex;
            align-items: center;
        }

        .search-input {
            padding: 12px;
            border-radius: 25px;
            border: 2px solid #ff9966;
            font-size: 1rem;
        }

        .search-btn {
            width: 50px;
            height: 50px;
            margin-left: 8px;
            border: none;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        /* 关键：缩短滚动容器高度，保证下面内容全出来 */
        .feed-container {
            height: 55vh;
            overflow-y: auto;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            padding: 12px;
            margin: 10px 0;
        }

        .post-item {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: start;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            margin-right: 12px;
            object-fit: cover;
            flex-shrink: 0;
        }

        /* 樱花图片 再次缩小 */
        .image-frame {
            max-width: 180px;
            margin: 8px 0;
            padding: 5px;
            border-radius: 10px;
        }

        .sakura-image {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 6px;
        }

        /* 文字单行强制不换行 */
        .highlight {
            background: #fff0f6;
            padding: 8px;
            border-radius: 8px;
            border: 1px dashed #ff85c0;
            white-space: nowrap;
            font-size: 13px;
            overflow: hidden;
        }

        .article-title {
            font-size: 1.1em;
            color: #e94f7c;
            margin-bottom: 4px;
        }

        .post-actions button {
            margin-right: 10px;
            padding: 4px 10px;
            border-radius: 15px;
            border: 1px solid #eee;
            background: #fff;
            cursor: pointer;
            font-size: 13px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
        }

        .nav-item {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            background: rgba(255,255,255,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .nav-item i {
            font-size: 26px;
            color: #ff9966;
        }

        .nav-item span {
            font-size: 12px;
            color: #666;
        }

        .article-post {
            background: linear-gradient(135deg, #fff5f5 0%, #fff 100%);
            border-left: 3px solid #ff69b4;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="ai-chat-btn" onclick="window.location.href='AI陪聊.html'">AI</button>
        <div class="search-box">
            <input type="text" class="search-input" placeholder="搜索动态或好友...">
            <button class="search-btn">
                <i class="fas fa-search"></i>
            </button>
        </div>
    </div>

    <div class="feed-container">
        <!-- 樱花动态 图片很小+文字一排 -->
        <div class="post-item article-post">
            <img src="shanghua.jpg" class="user-avatar">
            <div class="article-container">
                <h3 style="font-size:15px;margin-bottom:4px;">春意盎然</h3>
                <div class="article-content">
                    <h2 class="article-title">🌸 来看樱花 | 家门口的浪漫盛宴</h2>
                    <p style="font-size:14px;">春风十里，不如樱花满枝头！粉白花瓣如云似霞...</p>

                    <div class="image-frame">
                        <img src="sakura.webp" classsakura-image alt="樱花盛放">
                    </div>

                    <!-- 强制一行不换行 -->
                    <p class="highlight">📍 金海路138号 · 本周六将举办樱花摄影课堂</p>
                </div>
                <div class="post-actions" style="margin-top:6px;">
                    <button>👍 52</button>
                    <button>💬 24</button>
                </div>
            </div>
        </div>

        <!-- 全部评论动态完整露出 -->
        <div class="post-item">
            <img src="user1.jpg" class="user-avatar">
            <div>
                <h3>心如止水</h3>
                <p>今天在公园打太极，有一起的伙伴吗？🌞</p>
                <div class="post-actions">
                    <button>👍 12</button>
                    <button>💬 3</button>
                </div>
            </div>
        </div>

        <div class="post-item">
            <img src="user2.jpg" class="user-avatar">
            <div>
                <h3>爱笑爱长寿</h3>
                <p>刚学新编广场舞，明早7点文化广场教学！💃</p>
                <div class="post-actions">
                    <button>👍 28</button>
                    <button>💬 15</button>
                </div>
            </div>
        </div>

        <div class="post-item">
            <img src="user6.jpg" class="user-avatar">
            <div>
                <h3>细菌的生命力</h3>
                <p>钓鱼收获满满！🎣 免费送鲫鱼～</p>
                <div class="post-actions">
                    <button>👍 45</button>
                    <button>💬 22</button>
                </div>
            </div>
        </div>

        <div class="post-item">
            <img src="user4.jpg" class="user-avatar">
            <div>
                <h3>平安喜乐</h3>
                <p>老年大学书法班开课，报名从速 📚</p>
                <div class="post-actions">
                    <button>👍 33</button>
                    <button>💬 18</button>
                </div>
            </div>
        </div>

        <div class="post-item">
            <img src="user5.jpg" class="user-avatar">
            <div>
                <h3>上善若水</h3>
                <p>闲置磁力象棋棋盘免费送，私信领取～</p>
                <div class="post-actions">
                    <button>👍 17</button>
                    <button>💬 6</button>
                </div>
            </div>
        </div>

        <div class="post-item">
            <img src="user3.jpg" class="user-avatar">
            <div>
                <h3>好像有羊叫</h3>
                <p>周六采摘草莓组团，还有3个空位🚗</p>
                <div class="post-actions">
                    <button>👍 39</button>
                    <button>💬 12</button>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="handleNavClick('会员充值2.html')">
            <i class="fas fa-coins"></i>
            <span>充值</span>
        </div>
        <div class="nav-item" onclick="handleNavClick('地图2.html')">
            <i class="fas fa-map-marker-alt"></i>
            <span>附近</span>
        </div>
        <div class="nav-item" onclick="handleNavClick('我的.html')">
            <i class="fas user-circle"></i>
            <span>我的</span>
        </div>
        <div class="nav-item" onclick="handleNavClick('陪伴.html')">
            <i class="fas fa-heart"></i>
            <span>陪伴</span>
        </div>
    </div>

    <script>
        function handleNavClick(url) {
            const navItem = event.currentTarget;
            setTimeout(() => window.location.href = url, 250);
        }
    </script>
</body>
</html>
